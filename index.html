    // ==========================================
    // 2. FORMATTING HELPERS
    // ==========================================
    function formatINR(val, options = {}) {
      const num = Number(val);
      if (isNaN(num) || !isFinite(num)) return '₹0';
      const sign = num < 0 ? '-' : '';
      const abs = Math.abs(num);
      if (options.short) {
        if (abs >= 10000000) return `${sign}₹${(abs / 10000000).toFixed(2)} Cr`;
        if (abs >= 100000) return `${sign}₹${(abs / 100000).toFixed(2)} L`;
        return `${sign}₹${Math.round(abs).toLocaleString('en-IN')}`;
      }
      return `${sign}₹${Math.round(abs).toLocaleString('en-IN')}`;
    }

    function formatNumber(val, decimals = 0) {
      const num = Number(val);
      if (isNaN(num) || !isFinite(num)) return '0';
      if (decimals === 0) return Math.round(num).toLocaleString('en-IN');
      return num.toLocaleString('en-IN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      });
    }

    function formatPercent(val, decimals = 2) {
      const num = Number(val);
      if (isNaN(num) || !isFinite(num)) return '0.00%';
      return `${num.toFixed(decimals)}%`;
    }

    function formatYears(val, decimals = 2) {

    // ==========================================

    // ==========================================
    // 5. PURE FINANCIAL CALCULATION ENGINE
    // ==========================================
    function calculateDashboard(inputs) {
      const sofaQty = Number(inputs.sofaQty) || 0;
      const sofaPrice = Number(inputs.sofaPrice) || 0;
      const reclinerQty = Number(inputs.reclinerQty) || 0;
      const reclinerPrice = Number(inputs.reclinerPrice) || 0;
      const duoQty = Number(inputs.duoQty) || 0;
      const duoPrice = Number(inputs.duoPrice) || 0;
      const screens = Number(inputs.screens) || 0;
      const franchiseFeePerScreen = Number(inputs.franchiseFeePerScreen) || 0;

      const totalSeats = sofaQty + reclinerQty + duoQty;
      const sofaTotal = sofaQty * sofaPrice;
      const reclinerTotal = reclinerQty * reclinerPrice;
      const duoTotal = duoQty * duoPrice;
      const seatingTotal = sofaTotal + reclinerTotal + duoTotal;
      const avgCostPerSeat = totalSeats > 0 ? seatingTotal / totalSeats : 0;

      const franchiseFeeTotal = screens * franchiseFeePerScreen;
      const seatingAndFranchiseSubtotal = seatingTotal + franchiseFeeTotal;

      const foyerSqft = Number(inputs.foyerSqft) || 0;
      const foyerRate = Number(inputs.foyerRate) || 0;
      const foyerFitoutTotal = foyerSqft * foyerRate;

      const auditoriumAndFoyerTotal = seatingAndFranchiseSubtotal + foyerFitoutTotal;

      const gstCapexPct = Number(inputs.gstCapexPct) || 0;
      const gstCapex = auditoriumAndFoyerTotal * (gstCapexPct / 100);

      const preOpeningWC = Number(inputs.preOpeningWC) || 0;
      const totalInvestment = auditoriumAndFoyerTotal + gstCapex + preOpeningWC;
      const totalInvestmentPerSeat = totalSeats > 0 ? totalInvestment / totalSeats : 0;

      // Ticket Revenue
      const wdShows = Number(inputs.wdShows) || 0;
      const wdDays = Number(inputs.wdDays) || 0;
      const wdOccPct = Number(inputs.wdOccPct) || 0;
      const wdAtp = Number(inputs.wdAtp) || 0;

      const weShows = Number(inputs.weShows) || 0;
      const weDays = Number(inputs.weDays) || 0;
      const weOccPct = Number(inputs.weOccPct) || 0;
      const weAtp = Number(inputs.weAtp) || 0;

      const wdSeatShows = totalSeats * wdShows * wdDays;
      const wdTickets = wdSeatShows * (wdOccPct / 100);
      const wdGross = wdTickets * wdAtp;

      const weSeatShows = totalSeats * weShows * weDays;
      const weTickets = weSeatShows * (weOccPct / 100);
      const weGross = weTickets * weAtp;

      const totalSeatShows = wdSeatShows + weSeatShows;
      const totalTickets = wdTickets + weTickets;
      const blendedOccupancy = totalSeatShows > 0 ? totalTickets / totalSeatShows : 0;
      const grossTicketM = wdGross + weGross;
      const grossTicketA = grossTicketM * 12;
      const blendedAtp = totalTickets > 0 ? grossTicketM / totalTickets : 0;

      const gstTicketPct = Number(inputs.gstTicketPct) || 0;
      const gstTicketM = grossTicketM * (gstTicketPct / 100);
      const gstTicketA = gstTicketM * 12;

      const netBoxOfficeM = grossTicketM - gstTicketM;
      const netBoxOfficeA = netBoxOfficeM * 12;

      const distributorPct = Number(inputs.distributorPct) || 0;
      const distributorM = netBoxOfficeM * (distributorPct / 100);
      const distributorA = distributorM * 12;

      const totalDeductionsM = gstTicketM + distributorM;
      const totalDeductionsA = totalDeductionsM * 12;

      const exhibitorNetM = grossTicketM - totalDeductionsM;
      const exhibitorNetA = exhibitorNetM * 12;

      const franchiseeTicketPct = Number(inputs.franchiseeTicketPct) || 0;
      const franchiseeTicketM = exhibitorNetM * (franchiseeTicketPct / 100);
      const franchiseeTicketA = franchiseeTicketM * 12;

      // Food & Beverage & Private Screenings
      const fnbRatePerTicket = Number(inputs.fnbRatePerTicket) || 0;
      const concessionsGross = totalTickets * fnbRatePerTicket;
      const banquetBookings = Number(inputs.banquetBookings) || 0;
      const banquetRatePerSeat = Number(inputs.banquetRatePerSeat) || 99;
      const banquetSlotRate = totalSeats * banquetRatePerSeat;
      const banquetGross = banquetBookings * banquetSlotRate;
      const grossFnbM = concessionsGross + banquetGross;
      const grossFnbA = grossFnbM * 12;

      const fnbGstPct = Number(inputs.fnbGstPct) || 0;
      const gstRateFraction = fnbGstPct / 100;
      const fnbGstM = grossFnbM * (gstRateFraction / (1 + gstRateFraction));
      const fnbGstA = fnbGstM * 12;

      const fnbCogsPct = Number(inputs.fnbCogsPct) || 0;
      const fnbCogsM = grossFnbM * (fnbCogsPct / 100);
      const fnbCogsA = fnbCogsM * 12;

      const netFnbM = grossFnbM - fnbGstM - fnbCogsM;
      const netFnbA = netFnbM * 12;

      const franchiseeFnbPct = Number(inputs.franchiseeFnbPct) || 0;
      const franchiseeFnbM = netFnbM * (franchiseeFnbPct / 100);
      const franchiseeFnbA = franchiseeFnbM * 12;

      // Advertising
      const adQty = Number(inputs.adQty) || 0;
      const adRate = Number(inputs.adRate) || 0;
      const grossAdM = adQty * adRate;
      const grossAdA = grossAdM * 12;

      const agencyPct = Number(inputs.agencyPct) || 0;
      const agencyCommissionM = grossAdM * (agencyPct / 100);
      const agencyCommissionA = agencyCommissionM * 12;

      const netAdM = grossAdM - agencyCommissionM;
      const netAdA = netAdM * 12;

      const franchiseeAdPct = Number(inputs.franchiseeAdPct) || 0;
      const franchiseeAdM = netAdM * (franchiseeAdPct / 100);
      const franchiseeAdA = franchiseeAdM * 12;

      // Operating Expenses
      const rent = Number(inputs.rent) || 0;
      const cam = Number(inputs.cam) || 0;
      const electricity = Number(inputs.electricity) || 0;

      let internet = Number(inputs.internet) || 0;
      let amc = Number(inputs.amc) || 0;
      if (inputs.internetAMC !== undefined) {
        const totalAMC = Number(inputs.internetAMC) || 0;
        if (inputs.internet !== undefined && inputs.amc !== undefined && (Number(inputs.internet) + Number(inputs.amc) === totalAMC)) {
          internet = Number(inputs.internet) || 0;
          amc = Number(inputs.amc) || 0;
        } else {
          internet = Math.round(totalAMC * (15 / 55));
          amc = totalAMC - internet;
        }
      }

      const insurance = Number(inputs.insurance) || 0;
      const admin = Number(inputs.admin) || 0;
      const operators = Number(inputs.operators) || 0;
      const fnbStaff = Number(inputs.fnbStaff) || 0;
      const housekeeping = Number(inputs.housekeeping) || 0;
      const security = Number(inputs.security) || 0;

      const fixedOpexM = rent + cam + internet + electricity + amc + insurance + admin + operators + fnbStaff + housekeeping + security;

      const marketingPct = Number(inputs.marketingPct) || 0;
      const marketingM = (franchiseeTicketM + franchiseeFnbM) * (marketingPct / 100);
      const marketingA = marketingM * 12;

      const totalOpexM = fixedOpexM + marketingM;
      const totalOpexA = totalOpexM * 12;

      // Totals & Profit
      const totalFranchiseeIncomeM = franchiseeTicketM + franchiseeFnbM + franchiseeAdM;
      const totalFranchiseeIncomeA = totalFranchiseeIncomeM * 12;

      const netProfitM = totalFranchiseeIncomeM - totalOpexM;
      const netProfitY1 = netProfitM * 12;

      const roi = totalInvestment > 0 ? netProfitY1 / totalInvestment : 0;
      const payback = netProfitY1 > 0 ? totalInvestment / netProfitY1 : 0;

      // 3-Year Projections
      const growthPct = Number(inputs.growthPct) || 0;
      const growthFactor = 1 + growthPct / 100;
      const y1 = { year: 'Year 1', revenue: totalFranchiseeIncomeA, opex: totalOpexA, netProfit: netProfitY1 };
      const y2Net = netProfitY1 * growthFactor;
      const y2Rev = totalFranchiseeIncomeA * growthFactor;
      const y2 = { year: 'Year 2', revenue: y2Rev, opex: y2Rev - y2Net, netProfit: y2Net };
      const y3Net = y2Net * growthFactor;
      const y3Rev = y2Rev * growthFactor;

    // 6. VALIDATION ENGINE

    function validateInputs(inputs) {
      const errors = [];
      const warnings = [];

      if (!inputs.city || !inputs.city.trim()) warnings.push({ field: 'city', message: 'City is required for localized presentation.' });
      if (!inputs.state || !inputs.state.trim()) warnings.push({ field: 'state', message: 'State is required for regional benchmarks.' });
      if (!inputs.prospectName || !inputs.prospectName.trim()) warnings.push({ field: 'prospectName', message: 'Prospect/Investor name is empty.' });

      const screens = Number(inputs.screens);
      if (!screens || screens <= 0) errors.push({ field: 'screens', message: 'Screen count must be at least 1.' });

      const totalSeats = (Number(inputs.sofaQty) || 0) + (Number(inputs.reclinerQty) || 0) + (Number(inputs.duoQty) || 0);
      if (totalSeats <= 0) errors.push({ field: 'seating', message: 'Total seats must be greater than 0.' });

      const wdOcc = Number(inputs.wdOccPct);
      const weOcc = Number(inputs.weOccPct);
      if (wdOcc < 0 || wdOcc > 100) errors.push({ field: 'wdOccPct', message: 'Weekday occupancy must be between 0% and 100%.' });
      if (weOcc < 0 || weOcc > 100) errors.push({ field: 'weOccPct', message: 'Weekend occupancy must be between 0% and 100%.' });
      if (weOcc > 85) warnings.push({ field: 'weOccPct', message: 'Weekend occupancy above 85% may exceed realistic sustainable peaks.' });

      if (Number(inputs.wdAtp) <= 0) errors.push({ field: 'wdAtp', message: 'Weekday ATP must be greater than ₹0.' });
      if (Number(inputs.weAtp) <= 0) errors.push({ field: 'weAtp', message: 'Weekend ATP must be greater than ₹0.' });

      return { isValid: errors.length === 0, errors, warnings };
    }

    // ==========================================
    // 9. MASTER DASHBOARD APP
    // ==========================================
    function DashboardApp({ currentUser, onLogout }) {
      const [scenarios, setScenarios] = useState(() => {
        try {
          const saved = localStorage.getItem('connplex_scenarios_v3');
          return saved ? JSON.parse(saved) : INITIAL_SCENARIOS;
        } catch (e) {
          return INITIAL_SCENARIOS;
        }
      });

      const [activeScenarioId, setActiveScenarioId] = useState(() => scenarios[0]?.id || 'sc-1');

      const activeScenario = useMemo(() => {
        return scenarios.find(s => s.id === activeScenarioId) || scenarios[0];
      }, [scenarios, activeScenarioId]);

      const inputs = activeScenario.inputs;

      const [isPresenting, setIsPresenting] = useState(false);
      const [mobileTab, setMobileTab] = useState('console'); // 'console' | 'dashboard'
      const [showScenarioModal, setShowScenarioModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [activeTableTab, setActiveTableTab] = useState('summary'); // 'summary' | 'ticket' | 'fnb' | 'ad' | 'opex' | 'capex'

      // Section open states - default all open so no content is hidden, with quick Collapse/Expand All
      const [collapsedSections, setCollapsedSections] = useState({
        location: false,
        seating: false,
        foyer: false,
        ticket: false,
        fnb: false,
        ad: false,
        opex: false,
        growth: false
      });

      useEffect(() => {
        try {
          localStorage.setItem('connplex_scenarios_v3', JSON.stringify(scenarios));
        } catch (e) { }
      }, [scenarios]);

      const [showInternetAmcSplit, setShowInternetAmcSplit] = useState(false);

      const updateField = (key, val) => {
        setScenarios(prev => prev.map(s => {
          if (s.id === activeScenarioId) {
            return {
              ...s,
              inputs: { ...s.inputs, [key]: val }
            };
          }
          return s;
        }));
      };

      const updateNumField = (key, rawVal) => {
        const parsed = rawVal === '' ? 0 : parseFloat(rawVal);
        updateField(key, isNaN(parsed) ? 0 : parsed);
      };

      const updateInternetAMC = (rawVal) => {
        const parsed = rawVal === '' ? 0 : parseFloat(rawVal);
        const val = isNaN(parsed) ? 0 : parsed;
        const internetPart = Math.round(val * (15 / 55));
        const amcPart = val - internetPart;
        setScenarios(prev => prev.map(s => {
          if (s.id === activeScenarioId) {
            return {
              ...s,
              inputs: {
                ...s.inputs,
                internetAMC: val,
                internet: internetPart,
                amc: amcPart
              }
            };
          }
          return s;
        }));
      };

      const updateInternet = (rawVal) => {
        const parsed = rawVal === '' ? 0 : parseFloat(rawVal);
        const val = isNaN(parsed) ? 0 : parsed;
        setScenarios(prev => prev.map(s => {
          if (s.id === activeScenarioId) {
            const curAmc = Number(s.inputs.amc) || 0;
            return {
              ...s,
              inputs: {
                ...s.inputs,
                internet: val,
                internetAMC: val + curAmc
              }
            };
          }
          return s;
        }));
      };

      const updateAMC = (rawVal) => {
        const parsed = rawVal === '' ? 0 : parseFloat(rawVal);
        const val = isNaN(parsed) ? 0 : parsed;
        setScenarios(prev => prev.map(s => {
          if (s.id === activeScenarioId) {
            const curInternet = Number(s.inputs.internet) || 0;
            return {
              ...s,
              inputs: {
                ...s.inputs,
                amc: val,
                internetAMC: curInternet + val
              }
            };
          }
          return s;
        }));
      };

      const toggleSection = (sec) => {
        setCollapsedSections(prev => ({ ...prev, [sec]: !prev[sec] }));
      };

      const setAllSections = (openState) => {
        setCollapsedSections({
          location: !openState,
          seating: !openState,
          foyer: !openState,
          ticket: !openState,
          fnb: !openState,
          ad: !openState,
          opex: !openState,
          growth: !openState
        });
      };

      const dashboard = useMemo(() => {
        return calculateDashboard(inputs);
      }, [inputs]);

      const validation = useMemo(() => {
        return validateInputs(inputs);
      }, [inputs]);

      const handleReset = () => {
        setScenarios(prev => prev.map(s => {
          if (s.id === activeScenarioId) {
            return { ...s, inputs: { ...FRANCHISE_DEFAULTS } };
          }
          return s;
        }));
        setShowResetModal(false);
      };

      const createNewScenario = () => {
        const newId = 'sc-' + Date.now();
        const newSc = {
          id: newId,
          name: `${inputs.city || 'New'} — ${inputs.screens} Screens (Scenario ${scenarios.length + 1})`,
          isDefault: false,
          inputs: { ...inputs }
        };
        setScenarios(prev => [...prev, newSc]);
        setActiveScenarioId(newId);
      };

      const duplicateActiveScenario = () => {
        const newId = 'sc-' + Date.now();
        const newSc = {
          id: newId,
          name: `${activeScenario.name} (Copy)`,
          isDefault: false,
          inputs: { ...inputs }
        };
        setScenarios(prev => [...prev, newSc]);
        setActiveScenarioId(newId);
      };

      const [selectedScenarioIds, setSelectedScenarioIds] = useState([]);

      const toggleSelectScenario = (id) => {
        setSelectedScenarioIds(prev =>
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const selectAllScenarios = () => {
        if (selectedScenarioIds.length === scenarios.length) {
          setSelectedScenarioIds([]);
        } else {
          setSelectedScenarioIds(scenarios.map(s => s.id));
        }
      };

      const deleteSelectedScenarios = () => {
        if (selectedScenarioIds.length === 0) return;
        if (selectedScenarioIds.length >= scenarios.length) {
          alert('Cannot delete all scenarios. At least one scenario must be retained.');
          return;
        }
        const confirmMsg = selectedScenarioIds.length === 1
          ? 'Are you sure you want to delete the selected scenario?'
          : `Are you sure you want to delete the ${selectedScenarioIds.length} selected scenarios?`;
        if (!window.confirm(confirmMsg)) return;

        const remaining = scenarios.filter(s => !selectedScenarioIds.includes(s.id));
        setScenarios(remaining);
        if (selectedScenarioIds.includes(activeScenarioId)) {
          setActiveScenarioId(remaining[0].id);
        }
        setSelectedScenarioIds([]);
      };

      const deleteSingleScenario = (idToDelete) => {
        if (scenarios.length <= 1) {
          alert('Cannot delete the last remaining scenario.');
          return;
        }
        const toDelete = scenarios.find(s => s.id === idToDelete);
        const name = toDelete ? toDelete.name : 'this scenario';
        if (!window.confirm(`Are you sure you want to delete "${name}"?`)) return;

        const remaining = scenarios.filter(s => s.id !== idToDelete);
        setScenarios(remaining);
        if (activeScenarioId === idToDelete) {
          setActiveScenarioId(remaining[0].id);
        }
        setSelectedScenarioIds(prev => prev.filter(id => id !== idToDelete));
      };

      // Ensure selectedScenarioIds only contains existing scenarios
      useEffect(() => {
        setSelectedScenarioIds(prev => prev.filter(id => scenarios.some(s => s.id === id)));
      }, [scenarios]);

      return (
        <div className="flex flex-col min-h-screen bg-[#F7F9FC] text-[#101828]">

                  </div>
                  <div className="text-[11px] text-[#667085] font-normal hidden sm:block">Investor Financial Presentation Console</div>
                </div>
              </div>

              {/* View Mode Switcher (Desktop) */}

                <button

                  className={`px-3 py-1.5 rounded-md font-medium transition ${!isPresenting ? 'bg-white text-[#101828] shadow-xs font-semibold' : 'text-[#667085] hover:text-[#101828]'}`}
                >
                  Sales Rep Console
                </button>
                <button
                  onClick={() => setIsPresenting(true)}
                  className={`px-3 py-1.5 rounded-md font-medium transition ${isPresenting ? 'bg-[#F79009] text-white font-bold shadow-xs' : 'text-[#667085] hover:text-[#101828]'}`}
                >
                  Investor Presentation
                </button>
              </div>
            </div>

            {/* Mobile View Toggle */}
            <div className="flex md:hidden items-center bg-[#F2F4F7] p-1 rounded-lg border border-[#EAECF0] text-xs gap-1">
              <button
                onClick={() => { setIsPresenting(false); setMobileTab('console'); }}

                Inputs

              <button

                          <td className="py-2.5 px-3 text-right font-mono text-[#667085]">{inputs.adQty} commercial spots @ ₹{formatNumber(inputs.adRate)}/spot</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#101828]">{formatINR(dashboard.ad.grossAdM)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#101828]">{formatINR(dashboard.ad.grossAdA)}</td>
                        </tr>
                        <tr className="hover:bg-[#F9FAFB]/80 transition">
                          <td className="py-2.5 px-3 text-[#667085]">Less: Media Agency Commission @ {inputs.agencyPct}%</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#98A2B3]">{inputs.agencyPct}% of Gross Ad Revenue</td>
                          <td className="py-2.5 px-3 text-right font-mono text-red-600">-{formatINR(dashboard.ad.agencyCommissionM)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-red-600">-{formatINR(dashboard.ad.agencyCommissionA)}</td>
                        </tr>
                        <tr className="bg-[#F9FAFB]/60 font-semibold">
                          <td className="py-2.5 px-3 text-[#101828]">Net Cinema Advertising Realization</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#667085]">Gross Ad − Agency Commission</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#101828]">{formatINR(dashboard.ad.netAdM)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-[#101828]">{formatINR(dashboard.ad.netAdA)}</td>
                        </tr>
                        <tr className="bg-[#ECFDF3] font-extrabold border-t border-emerald-300">
                          <td className="py-2.5 px-3 text-emerald-900">Franchisee Retained Ad Share ({inputs.franchiseeAdPct}%)</td>
                          <td className="py-2.5 px-3 text-right font-mono text-emerald-800">{inputs.franchiseeAdPct}% of Net Ad (20% Brand Royalty)</td>
                          <td className="py-2.5 px-3 text-right font-mono text-emerald-800 font-bold">{formatINR(dashboard.ad.franchiseeAdM)}</td>
                          <td className="py-2.5 px-3 text-right font-mono text-emerald-800 font-bold">{formatINR(dashboard.ad.franchiseeAdA)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {/* SOURCED MARKET SIGNALS: WHY [STATE/CITY], WHY NOW */}
              <div className="bg-white border border-[#E4E7EC] rounded-xl p-5 sm:p-6 shadow-subtle space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-[#EAECF0]">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-brand-800">Regional Macroeconomic Indicators</span>
                    <h3 className="text-base font-bold text-[#101828] uppercase tracking-wider">
                      Why {inputs.state}, Why Now — Market Signals
                    </h3>
                  </div>
                  <div className="text-xs text-[#667085]">
                    City Catchment: <span className="text-[#101828] font-semibold">{inputs.city} Urban Metro</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                  {MARKET_STATISTICS.map(item => (
                    <div key={item.id} className="p-4 rounded-xl bg-[#F9FAFB] border border-[#EAECF0] hover:border-brand-300 hover:bg-white hover:shadow-subtle transition flex flex-col justify-between">
                      <div>
                        <div className="flex justify-between items-start gap-2 mb-1.5">
                          <span className="text-xs font-bold text-[#101828]">{item.metric}</span>
                          <span className="text-[10px] font-mono px-2 py-0.5 rounded-md bg-white text-[#475467] border border-[#E4E7EC]">
                            {item.geography}
                          </span>
                        </div>
                        <div className="text-sm font-extrabold text-[#B7791F] mb-1.5 font-mono">{item.value}</div>
                        <p className="text-xs text-[#475467] leading-relaxed">{item.detail}</p>
                      </div>
                      <div className="mt-3 pt-2 border-t border-[#EAECF0] text-[10px] text-[#667085] flex items-center justify-between">
                        <span>Source: <strong className="text-[#344054]">{item.source}</strong></span>
                        <span>Date: {item.sourceDate}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* BOX OFFICE BENCHMARKS */}
              <div className="bg-white border border-[#E4E7EC] rounded-xl p-5 sm:p-6 shadow-subtle">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4 pb-2 border-b border-[#EAECF0]">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-brand-800">Patron Demand Proof</span>
                    <h3 className="text-base font-bold text-[#101828] uppercase tracking-wider">
                      How Movies Earn — Recent Indian Box-Office Benchmarks
                    </h3>
                  </div>
                  <span className="text-xs text-[#667085] font-mono">2025–2026 Theatrical Slates</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-[#E4E7EC] text-[#667085] uppercase text-[10px] tracking-wider text-left bg-[#F9FAFB]">
                        <th className="py-2.5 px-3 font-semibold">Film & Year</th>
                        <th className="py-2.5 px-3 font-semibold">Opening Weekend</th>
                        <th className="py-2.5 px-3 font-semibold">Worldwide Gross</th>
                        <th className="py-2.5 px-3 font-semibold">Franchise Takeaway</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#F2F4F7]">
                      {BOX_OFFICE_BENCHMARKS.map((film, idx) => (
                        <tr key={idx} className="hover:bg-[#F9FAFB]/80 transition">
                          <td className="py-2.5 px-3 font-semibold text-[#101828]">
                            {film.film} ({film.year})
                            <div className="text-[10px] text-[#B7791F] font-normal">{film.genre}</div>
                          </td>
                          <td className="py-2.5 px-3 text-[#475467] font-mono">{film.openingWeekend}</td>
                          <td className="py-2.5 px-3 font-bold text-[#101828] font-mono">{film.worldwideGross}</td>
                          <td className="py-2.5 px-3 text-[#475467] leading-relaxed max-w-xs">{film.takeaway}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="mt-3 text-[11px] text-[#667085]">
                  Sources: {BOX_OFFICE_SOURCES}
                </div>
              </div>

              {/* FINANCIAL DISCLAIMER */}
              <footer className="p-4 sm:p-5 rounded-xl bg-white border border-[#E4E7EC] text-[#667085] text-xs leading-relaxed space-y-1.5 shadow-subtle">
                <div className="font-bold text-[#344054] text-[11px] uppercase tracking-wider">
                  Important Financial Disclaimer
                </div>
                <p>
                  All projections are based on the assumptions entered into this model and are intended for discussion and planning purposes only. Actual performance may vary based on location, occupancy, ticket pricing, film performance, operating costs, taxes, commercial terms and other market conditions. This model does not constitute a legal representation or guarantee of future returns.
                </p>
                <div className="text-[10px] text-[#98A2B3] pt-1 flex justify-between">
                  <span>ConnPlex Cinemas Limited · Franchise Development Division</span>
                  <span>Formula-Linked to Approved Excel Model (Investor Edition)</span>
                </div>
              </footer>

            </main>
          </div>

          {/* SCENARIO MANAGEMENT MODAL */}
          {showScenarioModal && (
            <div className="fixed inset-0 z-50 bg-[#101828]/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-[#E4E7EC] rounded-2xl w-full max-w-4xl p-6 shadow-xl animate-fade max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center pb-3 border-b border-[#EAECF0]">
                  <div>
                    <h3 className="text-lg font-bold text-[#101828]">Scenario Management & Comparison</h3>
                    <p className="text-xs text-[#667085]">Compare side-by-side performance across franchise configurations</p>
                  </div>
                  <button onClick={() => setShowScenarioModal(false)} className="text-[#98A2B3] hover:text-[#101828] text-lg p-1 rounded-lg hover:bg-[#F2F4F7] transition">✕</button>
                </div>

                <div className="my-4 overflow-x-auto flex-1">
                  <table className="w-full text-xs">
                    <thead>
                      <tr className="border-b border-[#E4E7EC] text-[#667085] uppercase text-[10px] text-left bg-[#F9FAFB]">
                        <th className="py-2.5 px-3 align-top font-semibold">
                          <div className="flex flex-col gap-1.5">
                            <span>Metric</span>
                            {scenarios.length > 1 && (
                              <button
                                type="button"
                                onClick={selectAllScenarios}
                                className="text-[10px] text-brand-700 hover:text-brand-800 underline font-medium normal-case text-left cursor-pointer transition"
                              >
                                {selectedScenarioIds.length === scenarios.length ? 'Deselect all' : 'Select all'}
                              </button>
                            )}
                          </div>
                        </th>
                        {scenarios.map(s => {
                          const isSelected = selectedScenarioIds.includes(s.id);
                          return (
                            <th
                              key={s.id}
                              className={`py-2.5 px-3 text-right align-top transition-colors ${
                                isSelected ? 'bg-[#FFFAEB]/80 border-b-2 border-b-[#F79009]' : ''
                              }`}
                            >
                              <div className="flex flex-col items-end gap-1.5">
                                <div className="flex items-center gap-2">
                                  <label className="inline-flex items-center gap-1.5 cursor-pointer text-[11px] font-medium text-[#475467] hover:text-[#101828] normal-case select-none">
                                    <input
                                      type="checkbox"
                                      checked={isSelected}
                                      onChange={() => toggleSelectScenario(s.id)}
                                      className="w-3.5 h-3.5 rounded border-[#D0D5DD] text-brand-600 focus:ring-brand-500 cursor-pointer accent-brand-600"
                                    />
                                    <span>Select</span>
                                  </label>
                                  {scenarios.length > 1 && (
                                    <button
                                      type="button"
                                      onClick={() => deleteSingleScenario(s.id)}
                                      title={`Delete ${s.name}`}
                                      className="text-[#98A2B3] hover:text-red-600 p-0.5 rounded hover:bg-red-50 transition cursor-pointer"
                                    >
                                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                                      </svg>
                                    </button>
                                  )}
                                </div>
                                <span className={`leading-tight ${s.id === activeScenarioId ? 'text-brand-800 font-bold' : 'text-[#344054] font-semibold'}`}>
                                  {s.name}
                                </span>
                              </div>
                            </th>
                          );
                        })}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#F2F4F7]">
                      {(() => {
                        const calculatedScenarios = scenarios.map(s => calculateDashboard(s.inputs));
                        return (
                          <>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Screens</td>
                              {scenarios.map((s) => (
                                <td key={s.id} className={`py-2 px-3 text-right font-mono font-bold text-[#101828] transition-colors ${selectedScenarioIds.includes(s.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{s.inputs.screens} Screens</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Total Seats</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono text-[#101828] transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{c.investment.totalSeats} seats</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Total Investment</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono font-bold text-[#101828] transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatINR(c.investment.totalInvestment, { short: true })}</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Year-1 Revenue</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono text-[#101828] transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatINR(c.totalIncomeA, { short: true })}</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Year-1 Net Profit</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono font-bold text-emerald-700 transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatINR(c.profit.netProfitY1, { short: true })}</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Return on Investment (ROI)</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono font-bold text-brand-800 transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatPercent(c.roi * 100)}</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Payback Period</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono text-[#101828] transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatYears(c.payback)}</td>
                              ))}
                            </tr>
                            <tr>
                              <td className="py-2 px-3 text-[#475467] font-medium">Blended Occupancy</td>
                              {calculatedScenarios.map((c, idx) => (
                                <td key={idx} className={`py-2 px-3 text-right font-mono text-[#101828] transition-colors ${selectedScenarioIds.includes(scenarios[idx]?.id) ? 'bg-[#FFFAEB]/40' : ''}`}>{formatPercent(c.ticket.blendedOccupancy * 100)}</td>
                              ))}
                            </tr>
                          </>
                        );
                      })()}
                    </tbody>
                  </table>
                </div>

                <div className="pt-3 border-t border-[#EAECF0] flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      type="button"
                      onClick={createNewScenario}
                      className="px-3 py-1.5 text-xs rounded-lg bg-white border border-[#D0D5DD] hover:border-[#98A2B3] text-[#344054] font-medium transition cursor-pointer shadow-xs"
                    >
                      + New Blank Scenario
                    </button>
                    <button
                      type="button"
                      onClick={duplicateActiveScenario}
                      className="px-3 py-1.5 text-xs rounded-lg bg-white border border-[#D0D5DD] hover:border-[#98A2B3] text-[#344054] font-medium transition cursor-pointer shadow-xs"
                    >
                      ⧉ Duplicate Active
                    </button>
                    <button
                      type="button"
                      onClick={deleteSelectedScenarios}
                      disabled={selectedScenarioIds.length === 0}
                      className={`flex items-center gap-1.5 px-3 py-1.5 text-xs rounded-lg font-medium transition ${
                        selectedScenarioIds.length > 0
                          ? 'bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 hover:border-red-300 shadow-xs cursor-pointer'
                          : 'bg-[#F9FAFB] text-[#98A2B3] border border-[#EAECF0] cursor-not-allowed opacity-60'
                      }`}
                    >
                      <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                      </svg>
                      Delete Selected {selectedScenarioIds.length > 0 ? `(${selectedScenarioIds.length})` : ''}
                    </button>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowScenarioModal(false)}
                    className="px-4 py-1.5 text-xs rounded-lg bg-[#101828] text-white font-bold hover:bg-[#1D2939] transition cursor-pointer shadow-xs"
                  >
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* RESET TO DEFAULTS MODAL */}
          {showResetModal && (
            <div className="fixed inset-0 z-50 bg-[#101828]/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white border border-[#E4E7EC] rounded-2xl w-full max-w-md p-6 shadow-xl animate-fade">
                <div className="flex items-center gap-3 text-[#D92D20] mb-2">
                  <div className="w-9 h-9 rounded-full bg-red-50 border border-red-200 flex items-center justify-center text-[#D92D20] font-bold text-base">
                    ⚠
                  </div>
                  <h3 className="text-lg font-bold text-[#101828]">Reset to Franchise Defaults?</h3>
                </div>
                <p className="text-xs text-[#475467] leading-relaxed mb-5">
                  This will restore all financial assumptions for <strong>{activeScenario.name}</strong> to the official CONNPLEX CINEMAS default benchmarks (200 seats, 3 screens, ₹3.83 Cr capex).
                </p>
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="px-4 py-2 text-xs rounded-lg border border-[#D0D5DD] text-[#344054] hover:bg-[#F9FAFB] font-medium shadow-xs transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleReset}
                    className="px-4 py-2 text-xs rounded-lg bg-[#D92D20] hover:bg-[#B42318] text-white font-semibold shadow-xs transition"
                  >
                    Confirm Reset
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // ROOT APPLICATION WITH AUTH STATE
    // ==========================================
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        try {
          return localStorage.getItem('connplex_auth_user') === 'reports@theconnplex.com';
        } catch (e) {
          return false;
        }
      });
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          return localStorage.getItem('connplex_auth_user') || '';
        } catch (e) {
          return '';
        }
      });

      const handleLoginSuccess = (userEmail) => {
        try {
          localStorage.setItem('connplex_auth_user', userEmail);
        } catch (e) { }
        setCurrentUser(userEmail);
        setIsAuthenticated(true);
      };

      const handleLogout = () => {
        try {
          localStorage.removeItem('connplex_auth_user');
        } catch (e) { }
        setCurrentUser('');
        setIsAuthenticated(false);
      };

      if (!isAuthenticated) {
        return <LoginPage onLoginSuccess={handleLoginSuccess} />;
      }

      return <DashboardApp currentUser={currentUser} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
